function pruefen(bool){
	var user=document.getElementById("text").value; 
	
	if(user==""){ alert("Bitte machen Sie eine Eingabe !");}
			if(user!=""){
			if(!document.cookie || bool){	writecookie(user); } 		
			} 
		return (user!="");
		}
		
function writecookie(user){	
	var f = document.formular;
		for (var i=0;i<f.geschlecht.length;i++)
		if (f.geschlecht[i].checked){			//Radiobuttonwert sichern
			var sex=f.geschlecht[i].value;	//alert(sex);
			savecookie(user,sex,"x","x","x");	
			coo.user=user;
			}
		}
		
		
function cooky(){
	if(!document.cookie){  
	helpme();	
		//Hilfe = window.open("hilfe.html", "Hilfe", "height=600,width=800");
		//Hilfe.focus();
		} else{	
		var bla=readname();
		document.formular.textfeld.value =bla;
	}
}

</script>
