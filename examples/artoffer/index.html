<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Artoffer - AdminWeb</title>
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.11.2/css/all.css" crossorigin="anonymous">
    <link rel="stylesheet" href="./css/bootstrap/bootstrap.4.1.1.css">
    <link rel="stylesheet" href="./css/cropper/cropper.min.css" />
    <link rel="stylesheet" href="./css/cropper/main.css" />
    <link rel="stylesheet" href="./css/cropper/artofferspecial.css" />
    <link rel="stylesheet" href="./css/cropper/colorchanger.css" />
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="row ">
                <div class="offset-1 col-10">
                    <h3>Artoffer Admin V2: Cropping Tool </h3>
                </div>
            </div>
        </div>
    </header>

    <div class="artOfferontainer">
   
<div style="padding: 1rem">
    <div class="row">
        <div class="col-md-10 b-space">

            <div class="row image-info">
                <div class="col">
                    Originalmaße:
                </div>
                <div class="col">
                    <span>Breite:</span>
                    <span id="o-width"></span>
                    <span>px</span>
                </div>
                <div class="col">
                    <span>Höhe:</span>
                    <span id="o-height"></span>
                    <span>px</span>
                </div>

            </div>

            <div class="row">

                <div class="img-container" id="img-container">
                    <img src="./images/picture.jpg" class="cropper-hidden">
                </div>
            </div>



            <div class="row image-info ">

                <div class="col-10 col-sm-8 col-lg-10">
                    <div class="row">
                        <div class="col-12">
                            Cropinformationen:
                        </div>
                        <div class="col-sm">
                            <span>X:</span>
                            <span id="dataX"></span>
                            <span>px</span>
                        </div>
                        <div class="col-sm">
                            <span>Y:</span>
                            <span id="dataY"></span>
                            <span>px</span>
                        </div>
                        <div class="col-sm">
                            <span>Breite:</span>
                            <span id="dataWidth"></span>
                            <span>px</span>
                        </div>
                        <div class="col-sm">
                            <span>Höhe:</span>
                            <span id="dataHeight"></span>
                            <span>px</span>
                        </div>
                        <div class="col-sm">
                            <span>Rotation:</span>
                            <span id="dataRotate"></span>
                            <span>px</span>
                        </div>
                        <div class="col-md d-none">
                            <span>ScaleX:</span>
                            <span id="dataScaleX"></span>
                            <span>px</span>
                        </div>
                        <div class="col-md d-none">
                            <span>ScaleY:</span>
                            <span id="dataScaleY"></span>
                            <span>px</span>
                        </div>
                    </div>
                </div>

                <div class="col-1 col-sm-4 col-lg-2">
                    <div class="row frameColors jsframeColors">
                        <div class="col-1"><input class="form-check-input" id="colorBlue" type="radio" name="frameColours" data-color="blue" checked="" /><label for="colorBlue" title="Rahmenfarbe blau" alt="Rahmenfarbe blau" /></div>
                        <div class="col-1"><input class="form-check-input" id="colorBlack" type="radio" name="frameColours" data-color="black" /><label for="colorBlack" title="Rahmenfarbe schwarz" alt="Rahmenfarbe schwarz" /></div>
                        <div class="col-1"><input class="form-check-input" id="colorRed" type="radio" name="frameColours" data-color="red" /><label for="colorRed" title="Rahmenfarbe rot" alt="Rahmenfarbe rot" /></div>
                        <div class="col-1"><input class="form-check-input" id="colorWhite" type="radio" name="frameColours" data-color="white" /><label for="colorWhite" title="Rahmenfarbe weiß" alt="Rahmenfarbe weiß" /></div>
                    </div>
                </div>

            </div>

        </div>

        <div class="col-md-2">
            <!-- <h3>Preview:</h3> -->
            <div class="docs-preview clearfix">
                <div class="img-preview preview-lg" style="width: 256px; height: 144px;"><img src="/images/picture.jpg" style="display: block; width: 320px; height: 180px; min-width: 0px !important; min-height: 0px !important; max-width: none !important; max-height: none !important; transform: translateX(-32px) translateY(-18px);"></div>
                <div class="d-none">
                    <div class="img-preview preview-md" style="width: 128px; height: 72px;"><img src="/images/picture.jpg" style="display: block; width: 160px; height: 90px; min-width: 0px !important; min-height: 0px !important; max-width: none !important; max-height: none !important; transform: translateX(-16px) translateY(-9px);"></div>
                    <div class="img-preview preview-sm" style="width: 64px; height: 36px;"><img src="/images/picture.jpg" style="display: block; width: 80px; height: 45px; min-width: 0px !important; min-height: 0px !important; max-width: none !important; max-height: none !important; transform: translateX(-8px) translateY(-4.5px);"></div>
                    <div class="img-preview preview-xs" style="width: 32px; height: 18px;"><img src="/images/picture.jpg" style="display: block; width: 40px; height: 22.5px; min-width: 0px !important; min-height: 0px !important; max-width: none !important; max-height: none !important; transform: translateX(-4px) translateY(-2.25px);"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="actions">
        <div class="docs-data docs-buttons">

            <div class="row">
                <div class="col-md-9">
                    <div class="row measure-group">
                        <h6 class="text-white col-12">
                            Bildabmessungen eingeben:
                        </h6>
                        <div class="input-group input-group-sm col-sm-4 col-md-3">
                            <input type="number" oninput="this.value = Math.abs(this.value)" class="form-control" min="0" id="setDataWidth" placeholder="Bildweite">
                            <span class="input-group-append">
                                <span class="input-group-text">px</span>
                            </span>
                        </div>
                        <div class="input-group input-group-sm col-sm-4 col-md-3">
                            <input type="number" oninput="this.value = Math.abs(this.value)" class="form-control" min="0" id="setDataHeight" placeholder="Bildhöhe">
                            <span class="input-group-append">
                                <span class="input-group-text">px</span>
                            </span>
                        </div>
                        <div class="input-group input-group-sm col-sm-4 col-md-3">
                            <button type="button" class="btn btn-primary" data-method="setCropBoxData" data-option='{"left":0,"top":0,"width":0,"height":0,"subMethod":"byhand"}' title="Rahmen setzen">
                                Bildmaße übernehmen <!-- cropper.setCropBoxData(data) -->
                                <span class="fa fa-check"></span>
                            </button>

                        </div>
                    </div>
                </div>
                <div class="col-md-9">

                    <!-- <h3>Bildabmessungen:</h3> -->
                        <div class="btn-group" style="display:none;">
                            <button type="button" class="btn btn-primary" data-method="setDragMode" data-option="move" title="Move">
                                <span class="docs-tooltip" data-toggle="tooltip" title="" data-original-title="cropper.setDragMode(&quot;move&quot;)">
                                    <span class="fa fa-arrows-alt"></span>
                                </span>
                            </button>
                            <button type="button" class="btn btn-primary" data-method="setDragMode" data-option="crop" title="Crop" style="display:none;">
                                <span class="docs-tooltip" data-toggle="tooltip" title="" data-original-title="cropper.setDragMode(&quot;crop&quot;)">
                                    <span class="fa fa-crop-alt"></span>
                                </span>
                            </button>
                        </div>

                        <div class="btn-group">
                            <button type="button" class="btn btn-primary" data-method="zoom" data-option="0.1" title="Zoom In">
                                <span class="docs-tooltip" data-toggle="tooltip" title="" data-original-title="cropper.zoom(0.1)">
                                    <span class="fa fa-search-plus"></span>
                                </span>
                            </button>
                            <button type="button" class="btn btn-primary" data-method="zoom" data-option="-0.1" title="Zoom Out">
                                <span class="docs-tooltip" data-toggle="tooltip" title="" data-original-title="cropper.zoom(-0.1)">
                                    <span class="fa fa-search-minus"></span>
                                </span>
                            </button>
                        </div>

                        <div class="btn-group">
                            <button type="button" class="btn btn-primary" data-method="move" data-option="-10" data-second-option="0" title="Move Left">
                                <span class="docs-tooltip" data-toggle="tooltip" title="" data-original-title="cropper.move(-10, 0)">
                                    <span class="fa fa-arrow-left"></span>
                                </span>
                            </button>
                            <button type="button" class="btn btn-primary" data-method="move" data-option="10" data-second-option="0" title="Move Right">
                                <span class="docs-tooltip" data-toggle="tooltip" title="" data-original-title="cropper.move(10, 0)">
                                    <span class="fa fa-arrow-right"></span>
                                </span>
                            </button>
                            <button type="button" class="btn btn-primary" data-method="move" data-option="0" data-second-option="-10" title="Move Up">
                                <span class="docs-tooltip" data-toggle="tooltip" title="" data-original-title="cropper.move(0, -10)">
                                    <span class="fa fa-arrow-up"></span>
                                </span>
                            </button>
                            <button type="button" class="btn btn-primary" data-method="move" data-option="0" data-second-option="10" title="Move Down">
                                <span class="docs-tooltip" data-toggle="tooltip" title="" data-original-title="cropper.move(0, 10)">
                                    <span class="fa fa-arrow-down"></span>
                                </span>
                            </button>
                        </div>

                        <div class="btn-group">
                            <button type="button" class="btn btn-primary" data-method="rotate" data-option="-45" title="Rotate Left">
                                <span class="docs-tooltip" data-toggle="tooltip" title="" data-original-title="cropper.rotate(-45)">
                                    <span class="fa fa-undo-alt"></span>
                                </span>
                            </button>
                            <button type="button" class="btn btn-primary" data-method="rotate" data-option="45" title="Rotate Right">
                                <span class="docs-tooltip" data-toggle="tooltip" title="" data-original-title="cropper.rotate(45)">
                                    <span class="fa fa-redo-alt"></span>
                                </span>
                            </button>
                        </div>

                        <div class="btn-group">
                            <button type="button" class="btn btn-primary" data-method="scaleX" data-option="-1" title="Flip Horizontal">
                                <span class="docs-tooltip" data-toggle="tooltip" title="" data-original-title="cropper.scaleX(-1)">
                                    <span class="fa fa-arrows-alt-h"></span>
                                </span>
                            </button>
                            <button type="button" class="btn btn-primary" data-method="scaleY" data-option="-1" title="Flip Vertical">
                                <span class="docs-tooltip" data-toggle="tooltip" title="" data-original-title="cropper.scaleY(-1)">
                                    <span class="fa fa-arrows-alt-v"></span>
                                </span>
                            </button>
                        </div>

                        <div class="btn-group">
                            <button type="button" class="btn btn-primary" data-method="crop" title="Crop">
                                <span class="docs-tooltip" data-toggle="tooltip" title="" data-original-title="cropper.crop()">
                                    <span class="fa fa-check"></span>
                                </span>
                            </button>
                            <button type="button" class="btn btn-primary" data-method="clear" title="Clear">
                                <span class="docs-tooltip" data-toggle="tooltip" title="" data-original-title="cropper.clear()">
                                    <span class="fa fa-times"></span>
                                </span>
                            </button>
                        </div>

                        <div class="btn-group">
                            <button type="button" class="btn btn-primary" data-method="disable" title="Disable">
                                <span class="docs-tooltip" data-toggle="tooltip" title="" data-original-title="cropper.disable()">
                                    <span class="fa fa-lock"></span>
                                </span>
                            </button>
                            <button type="button" class="btn btn-primary" data-method="enable" title="Enable">
                                <span class="docs-tooltip" data-toggle="tooltip" title="" data-original-title="cropper.enable()">
                                    <span class="fa fa-unlock"></span>
                                </span>
                            </button>
                        </div>

                        <div class="btn-group">
                            <button type="button" class="btn btn-primary" data-method="reset" title="Reset">
                                <span class="docs-tooltip" data-toggle="tooltip" title="" data-original-title="cropper.reset()">
                                    <span class="fa fa-sync-alt"></span>
                                </span>
                            </button>
                            <label class="btn btn-primary btn-upload" for="inputImage" title="Upload image file">
                                <input type="file" class="sr-only" id="inputImage" name="file" accept="image/*">
                                <span class="docs-tooltip" data-toggle="tooltip" title="" data-original-title="Import image with Blob URLs">
                                    <span class="fa fa-upload"></span>
                                </span>
                            </label>
                            <button type="button" class="btn btn-primary d-none" data-method="destroy" title="Destroy">
                                <span class="docs-tooltip" data-toggle="tooltip" title="" data-original-title="cropper.destroy()">
                                    <span class="fa fa-power-off"></span>
                                </span>
                            </button>
                        </div>

                        <div class="btn-group btn-group-crop">
                            <button type="button" class="btn btn-success" data-method="getCroppedCanvas" data-option="{ &quot;maxWidth&quot;: 4096, &quot;maxHeight&quot;: 4096 }">
                                <span class="docs-tooltip" data-toggle="tooltip" title="" data-original-title="cropper.getCroppedCanvas({ maxWidth: 4096, maxHeight: 4096 })">
                                    Get Cropped Canvas
                                </span>
                            </button>
                            <button type="button" class="btn btn-success" data-method="getCroppedCanvas" data-option="{ &quot;width&quot;: 160, &quot;height&quot;: 90 }">
                                <span class="docs-tooltip" data-toggle="tooltip" title="" data-original-title="cropper.getCroppedCanvas({ width: 160, height: 90 })">
                                    160×90
                                </span>
                            </button>
                            <button type="button" class="btn btn-success" data-method="getCroppedCanvas" data-option="{ &quot;width&quot;: 320, &quot;height&quot;: 180 }">
                                <span class="docs-tooltip" data-toggle="tooltip" title="" data-original-title="cropper.getCroppedCanvas({ width: 320, height: 180 })">
                                    320×180
                                </span>
                            </button>
                        </div>

                        <div class="docbuttons measure-group">
                            <!-- Show the cropped image in modal -->
                            <div class="modal fade docs-cropped" id="getCroppedCanvasModal" role="dialog" aria-hidden="true" aria-labelledby="getCroppedCanvasTitle" tabindex="-1">
                                <div class="modal-dialog">
                                    <div class="modal-content">
                                        <div class="modal-header">
                                            <h5 class="modal-title" id="getCroppedCanvasTitle">Cropped</h5>
                                            <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                                                <span aria-hidden="true">×</span>
                                            </button>
                                        </div>
                                        <div class="modal-body"></div>
                                        <div class="modal-footer">
                                            <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
                                            <a class="btn btn-primary" id="download" href="javascript:void(0);" download="cropped.jpg">Download</a>
                                        </div>
                                    </div>
                                </div>
                            </div><!-- /.modal -->
                            <div class="d-none">
                                <button type="button" class="btn btn-secondary" data-method="getData" data-option="" data-target="#putData">
                                    <span class="docs-tooltip" data-toggle="tooltip" title="" data-original-title="cropper.getData()">
                                        Get Data
                                    </span>
                                </button>
                                <button type="button" class="btn btn-secondary" data-method="setData" data-target="#putData">
                                    <span class="docs-tooltip" data-toggle="tooltip" title="" data-original-title="cropper.setData(data)">
                                        Set Data
                                    </span>
                                </button>
                                <button type="button" class="btn btn-secondary" data-method="getContainerData" data-option="" data-target="#putData">
                                    <span class="docs-tooltip" data-toggle="tooltip" title="" data-original-title="cropper.getContainerData()">
                                        Get Container Data
                                    </span>
                                </button>
                                <button type="button" class="btn btn-secondary" data-method="getImageData" data-option="" data-target="#putData">
                                    <span class="docs-tooltip" data-toggle="tooltip" title="" data-original-title="cropper.getImageData()">
                                        Get Image Data
                                    </span>
                                </button>
                                <button type="button" class="btn btn-secondary" data-method="getCanvasData" data-option="" data-target="#putData">
                                    <span class="docs-tooltip" data-toggle="tooltip" title="" data-original-title="cropper.getCanvasData()">
                                        Get Canvas Data
                                    </span>
                                </button>
                                <button type="button" class="btn btn-secondary" data-method="setCanvasData" data-target="#putData">
                                    <span class="docs-tooltip" data-toggle="tooltip" title="" data-original-title="cropper.setCanvasData(data)">
                                        Set Canvas Data
                                    </span>
                                </button>
                                <button type="button" class="btn btn-secondary" data-method="getCropBoxData" data-option="" data-target="#putData">
                                    <span class="docs-tooltip" data-toggle="tooltip" title="" data-original-title="cropper.getCropBoxData()">
                                        Get Crop Box Data
                                    </span>
                                </button>
                                <button type="button" class="btn btn-secondary" data-method="setCropBoxData" data-target="#putData">
                                    <span class="docs-tooltip" data-toggle="tooltip" title="" data-original-title="cropper.setCropBoxData(data)">
                                        Set Crop Box Data
                                    </span>
                                </button>
                                <button type="button" class="btn btn-secondary" data-method="moveTo" data-option="0">
                                    <span class="docs-tooltip" data-toggle="tooltip" title="" data-original-title="cropper.moveTo(0)">
                                        Move to [0,0]
                                    </span>
                                </button>
                                <button type="button" class="btn btn-secondary" data-method="zoomTo" data-option="1">
                                    <span class="docs-tooltip" data-toggle="tooltip" title="" data-original-title="cropper.zoomTo(1)">
                                        Zoom to 100%
                                    </span>
                                </button>
                                <button type="button" class="btn btn-secondary" data-method="rotateTo" data-option="180">
                                    <span class="docs-tooltip" data-toggle="tooltip" title="" data-original-title="cropper.rotateTo(180)">
                                        Rotate 180°
                                    </span>
                                </button>
                                <button type="button" class="btn btn-secondary" data-method="scale" data-option="-2" data-second-option="-1">
                                    <span class="docs-tooltip" data-toggle="tooltip" title="" data-original-title="cropper.scale(-2, -1)">
                                        Scale (-2, -1)
                                    </span>
                                </button>
                                <textarea class="form-control" id="putData" placeholder="Get data to here or set data with this value"></textarea>
                            </div>

                            <!-- ------------------------------------------------- set the measures for the buttons ------------------------------------------------------------- -->
                            <button type="button" class="btn btn-primary" data-method="setCropBoxData" data-option='{"left":100,"top":100,"width":5920,"height":2563,"aspectRatio":"calc"}'>
                                <span class="docs-tooltip" data-toggle="tooltip" title="" data-original-title="Header groß" aria-describedby="tooltip216269">
                                    Header groß
                                </span>
                            </button>

                            <button type="button" class="btn btn-primary" data-method="setCropBoxData" data-option='{"left":100,"top":100,"width":3021,"height":1791,"aspectRatio":"calc"}'>
                                <span class="docs-tooltip" data-toggle="tooltip" title="" data-original-title=" Header" aria-describedby="tooltip216269">
                                    Header
                                </span>
                            </button>

                            <button type="button" class="btn btn-primary" data-method="setCropBoxData" data-option='{"left":100,"top":100,"width":1800,"height":1200,"aspectRatio":"calc"}'>
                                <span class="docs-tooltip" data-toggle="tooltip" title="" data-original-title="Fokus quer" aria-describedby="tooltip216269">
                                    Fokus quer
                                </span>
                            </button>

                            <button type="button" class="btn btn-primary" data-method="setCropBoxData" data-option='{"left":200,"top":200,"width":1200,"height":1800,"aspectRatio":"calc"}'>
                                <span class="docs-tooltip" data-toggle="tooltip" title="" data-original-title="Fokus hoch" aria-describedby="tooltip216269">
                                    Fokus hoch
                                </span>
                            </button>

                            <button type="button" class="btn btn-primary" data-method="setCropBoxData" data-option='{"left":100,"top":100,"width":1200,"height":700,"aspectRatio":"calc"}'>
                                <span class="docs-tooltip" data-toggle="tooltip" title="" data-original-title="Kategorie" aria-describedby="tooltip216269">
                                    Kategorie
                                </span>
                            </button>

                            <button type="button" class="btn btn-primary" data-method="setCropBoxData" data-option='{"left":100,"top":100,"width":500,"height":500,"aspectRatio":"calc"}'>
                                <span class="docs-tooltip" data-toggle="tooltip" title="" data-original-title="Kunstschaffende" aria-describedby="tooltip216269">
                                    Künstler
                                </span>
                            </button>

                            <button type="button" class="btn btn-primary" data-method="setCropBoxData" data-option='{"left":100,"top":100,"width":1200,"height":600,"aspectRatio":"calc"}'>
                                <span class="docs-tooltip" data-toggle="tooltip" title="" data-original-title="Motive quer" aria-describedby="tooltip216269">
                                    Motive quer
                                </span>
                            </button>

                            <button type="button" class="btn btn-primary" data-method="setCropBoxData" data-option='{"left":100,"top":100,"width":600,"height":1500,"aspectRatio":"calc"}'>
                                <span class="docs-tooltip" data-toggle="tooltip" title="" data-original-title="Motive hoch" aria-describedby="tooltip216269">
                                    Motive hoch
                                </span>
                            </button>
                        </div>

                        <div class="docs-toggles">

                            <div class="btn-group btn-group-crop" data-toggle="buttons">
                                <label class="btn btn-primary active">
                                    <input type="radio" class="sr-only" id="aspectRatio1" name="aspectRatio" value="1.7777777777777777">
                                    <span class="docs-tooltip" data-toggle="tooltip" title="" data-original-title="aspectRatio: 16 / 9">
                                        16:9
                                    </span>
                                </label>
                                <label class="btn btn-primary">
                                    <input type="radio" class="sr-only" id="aspectRatio2" name="aspectRatio" value="1.3333333333333333">
                                    <span class="docs-tooltip" data-toggle="tooltip" title="" data-original-title="aspectRatio: 4 / 3">
                                        4:3
                                    </span>
                                </label>
                                <label class="btn btn-primary">
                                    <input type="radio" class="sr-only" id="aspectRatio3" name="aspectRatio" value="1">
                                    <span class="docs-tooltip" data-toggle="tooltip" title="" data-original-title="aspectRatio: 1 / 1">
                                        1:1
                                    </span>
                                </label>
                                <label class="btn btn-primary">
                                    <input type="radio" class="sr-only" id="aspectRatio4" name="aspectRatio" value="0.6666666666666666">
                                    <span class="docs-tooltip" data-toggle="tooltip" title="" data-original-title="aspectRatio: 2 / 3">
                                        2:3
                                    </span>
                                </label>
                                <label class="btn btn-primary">
                                    <input type="radio" class="sr-only" id="aspectRatio5" name="aspectRatio" value="NaN">
                                    <span class="docs-tooltip" data-toggle="tooltip" title="" data-original-title="aspectRatio: NaN">
                                        Free
                                    </span>
                                </label>
                            </div>

                            <div class="btn-group btn-group-crop d-none" data-toggle="buttons">
                                <label class="btn btn-primary active">
                                    <input type="radio" class="sr-only" id="viewMode0" name="viewMode" value="0" checked="">
                                    <span class="docs-tooltip" data-toggle="tooltip" title="" data-original-title="View Mode 0">
                                        VM0
                                    </span>
                                </label>
                                <label class="btn btn-primary">
                                    <input type="radio" class="sr-only" id="viewMode1" name="viewMode" value="1">
                                    <span class="docs-tooltip" data-toggle="tooltip" title="" data-original-title="View Mode 1">
                                        VM1
                                    </span>
                                </label>
                                <label class="btn btn-primary">
                                    <input type="radio" class="sr-only" id="viewMode2" name="viewMode" value="2">
                                    <span class="docs-tooltip" data-toggle="tooltip" title="" data-original-title="View Mode 2">
                                        VM2
                                    </span>
                                </label>
                                <label class="btn btn-primary">
                                    <input type="radio" class="sr-only" id="viewMode3" name="viewMode" value="3">
